<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#167A45" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111411" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beathill Studio">
<title>Beathill Studio</title>
<style>
/* Palette mirrors ShortGenTheme.kt so the web client matches the Android app. */
:root {
  --primary:#167A45; --on-primary:#FFFFFF;
  --primary-container:#B7F3CB; --on-primary-container:#00210F;
  --secondary:#476452; --tertiary:#3B6470;
  --background:#F7F9F7; --surface:#F7F9F7; --surface-variant:#E0E4E0;
  --on-surface:#191C19; --on-surface-variant:#414942;
  --outline:#71796F; --error:#BA1A1A; --on-error:#FFFFFF;
  --scrim:rgba(0,0,0,.32);
  --radius:16px; --radius-sm:10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary:#78D99A; --on-primary:#00391B;
    --primary-container:#005228; --on-primary-container:#96F7B4;
    --secondary:#ADCDB7; --tertiary:#A2CEDA;
    --background:#111411; --surface:#111411; --surface-variant:#414942;
    --on-surface:#E1E3DE; --on-surface-variant:#C0C9BF;
    --outline:#8B938A; --error:#FFB4AB; --on-error:#690005;
    --scrim:rgba(0,0,0,.5);
  }
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; padding:0; background:var(--background); color:var(--on-surface);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
body { padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
h1,h2,h3 { font-weight:600; letter-spacing:-.01em; }
a { color:var(--primary); }

/* top app bar */
.appbar { position:sticky; top:0; z-index:20; background:var(--surface);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; gap:12px;
  border-bottom:1px solid var(--surface-variant); }
.appbar h1 { font-size:20px; margin:0; flex:1; }
.appbar .back { background:none; border:none; color:var(--on-surface); font-size:22px;
  padding:4px 8px; cursor:pointer; border-radius:50%; }

main { padding:16px; max-width:720px; margin:0 auto; }

/* cards */
.card { background:var(--surface); border:1px solid var(--surface-variant);
  border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card h2 { font-size:16px; margin:0 0 12px; }
.muted { color:var(--on-surface-variant); font-size:13px; }

/* buttons */
button.filled { background:var(--primary); color:var(--on-primary); border:none;
  border-radius:100px; padding:14px 24px; font-size:15px; font-weight:600; cursor:pointer; width:100%; }
button.filled:disabled { background:var(--surface-variant); color:var(--on-surface-variant); cursor:not-allowed; }
button.tonal { background:var(--primary-container); color:var(--on-primary-container); border:none;
  border-radius:100px; padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer; }
button.outlined { background:none; color:var(--primary); border:1px solid var(--outline);
  border-radius:100px; padding:11px 18px; font-size:14px; cursor:pointer; }
button.text { background:none; border:none; color:var(--primary); font-size:14px;
  padding:8px; cursor:pointer; }
button.danger { color:var(--error); }
.row { display:flex; gap:8px; align-items:center; }
.row.wrap { flex-wrap:wrap; }
.spacer { flex:1; }

/* inputs */
label.field { display:block; margin-bottom:14px; }
label.field > span { display:block; font-size:13px; color:var(--on-surface-variant); margin-bottom:6px; }
input[type=text], input[type=number], textarea, select {
  width:100%; padding:13px 14px; font-size:15px; font-family:inherit;
  background:var(--surface); color:var(--on-surface);
  border:1px solid var(--outline); border-radius:var(--radius-sm); }
textarea { min-height:88px; resize:vertical; }
input[type=color] { width:52px; height:38px; padding:2px; border:1px solid var(--outline);
  border-radius:8px; background:var(--surface); }
/* switch row, mirrors ToggleRow in the app */
.toggle { display:flex; align-items:center; gap:12px; padding:10px 0; }
.toggle span { flex:1; font-size:15px; }
.toggle input { width:44px; height:26px; appearance:none; background:var(--surface-variant);
  border-radius:100px; position:relative; cursor:pointer; transition:background .15s; }
.toggle input:checked { background:var(--primary); }
.toggle input::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px;
  background:#fff; border-radius:50%; transition:transform .15s; }
.toggle input:checked::after { transform:translateX(18px); }

/* chips (platform + choice rows) */
.chips { display:flex; gap:8px; flex-wrap:wrap; }
.chip { border:1px solid var(--outline); border-radius:100px; padding:9px 16px; font-size:14px;
  cursor:pointer; background:none; color:var(--on-surface); user-select:none; }
.chip.selected { background:var(--primary-container); color:var(--on-primary-container);
  border-color:transparent; font-weight:600; }
.chip:disabled { opacity:.4; cursor:not-allowed; }

/* progress */
.bar { height:8px; background:var(--surface-variant); border-radius:100px; overflow:hidden; margin:8px 0; }
.bar > i { display:block; height:100%; background:var(--primary); width:0; transition:width .3s; }

/* job list */
.job { display:flex; gap:12px; align-items:center; padding:14px 0;
  border-bottom:1px solid var(--surface-variant); cursor:pointer; }
.job:last-child { border-bottom:none; }
.job .meta { flex:1; min-width:0; }
.job .name { font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.status { font-size:12px; font-weight:600; padding:4px 10px; border-radius:100px;
  background:var(--surface-variant); color:var(--on-surface-variant); white-space:nowrap; }
.status.completed { background:var(--primary-container); color:var(--on-primary-container); }
.status.failed { background:#FFDAD6; color:#410002; }
@media (prefers-color-scheme: dark) { .status.failed { background:#93000A; color:#FFDAD6; } }

/* thumbnail candidates */
.strip { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
.strip img { height:76px; border-radius:8px; border:3px solid transparent; cursor:pointer; flex:none; }
.strip img.selected { border-color:var(--primary); }
video, img.preview { width:100%; border-radius:var(--radius-sm); background:#000; display:block; }

/* bottom navigation, mirrors the app's tabs */
nav.bottom { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--surface);
  border-top:1px solid var(--surface-variant); padding-bottom:env(safe-area-inset-bottom); z-index:20; }
nav.bottom button { flex:1; background:none; border:none; color:var(--on-surface-variant);
  padding:10px 4px 12px; font-size:11px; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; gap:3px; }
nav.bottom button.active { color:var(--primary); font-weight:600; }
nav.bottom .ico { font-size:20px; line-height:1; }

/* toast */
#toast { position:fixed; left:50%; transform:translateX(-50%); bottom:88px; z-index:50;
  background:var(--on-surface); color:var(--surface); padding:12px 18px; border-radius:10px;
  font-size:14px; max-width:88%; opacity:0; pointer-events:none; transition:opacity .2s; }
#toast.show { opacity:1; }
.hidden { display:none !important; }
.center { text-align:center; }
</style>
</head>
<body>

<div class="appbar">
  <button class="back hidden" id="backBtn" aria-label="Back">&#8592;</button>
  <h1 id="title">Beathill Studio</h1>
  <span class="muted" id="accountLabel"></span>
</div>

<main id="main"></main>

<nav class="bottom hidden" id="nav">
  <button data-view="upload" class="active"><span class="ico">&#8593;</span>Upload</button>
  <button data-view="jobs"><span class="ico">&#9776;</span>Videos</button>
  <button data-view="connections"><span class="ico">&#128279;</span>Accounts</button>
  <button data-view="settings"><span class="ico">&#9881;</span>Settings</button>
</nav>

<div id="toast"></div>

<script>
"use strict";
/* ------------------------------------------------------------------ *
 * Beathill Studio - web client
 * Talks to the same /api/mobile/* API as the Android app, so workflow
 * and server behaviour are identical. Auth is a bearer token issued by
 * scripts/issue_tester.py; jobs are owned by that tester account, so
 * publishing uses THEIR linked social accounts, never the server ones.
 * ------------------------------------------------------------------ */

const API = "";                       // same origin
const TOKEN_KEY = "bst_token";
const PREF_KEY  = "bst_upload_prefs";
const CHUNK_FALLBACK = 8 * 1024 * 1024;
const ALLOWED = [".mp4", ".mov", ".avi", ".mkv", ".webm"];
const PLATFORMS = ["youtube", "instagram", "facebook", "tiktok"];
const PLATFORM_LABEL = { youtube:"YouTube", instagram:"Instagram", facebook:"Facebook", tiktok:"TikTok" };

let token = null;
let account = null;
let view = "upload";
let currentJob = null;
let pollTimer = null;
let uploading = false;
let wakeLock = null;
const blobCache = new Map();

/* ---- unfinished-upload state (survives reload, tab crash, phone restart) ---- */
const PENDING_KEY = "bst_pending_upload";
function getPending() { try { return JSON.parse(localStorage.getItem(PENDING_KEY)); } catch { return null; } }
function setPending(p) { localStorage.setItem(PENDING_KEY, JSON.stringify(p)); }
function clearPending() { localStorage.removeItem(PENDING_KEY); }

/* Keep the screen awake so iOS/Android don't suspend the tab mid-upload. */
async function acquireWakeLock() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }
  catch { /* unsupported or denied - upload still works, just keep the screen on */ }
}
function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }
document.addEventListener("visibilitychange", () => {
  if (uploading && document.visibilityState === "visible" && !wakeLock) acquireWakeLock();
});
window.addEventListener("beforeunload", (e) => {
  if (uploading) { e.preventDefault(); e.returnValue = ""; }
});
async function waitForOnline(onWait) {
  if (navigator.onLine) return;
  onWait && onWait();
  await new Promise(r => window.addEventListener("online", r, { once: true }));
}

/* ---------------------------- helpers ---------------------------- */

const $ = (sel, root=document) => root.querySelector(sel);
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function toast(msg, ms=3200) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms);
}

async function api(method, path, body) {
  const opts = { method, headers: { "Authorization": "Bearer " + token } };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { /* non-JSON */ }
  if (!res.ok) {
    let detail = data && data.detail;
    if (detail && typeof detail === "object") detail = detail.message || JSON.stringify(detail);
    const err = new Error(detail || ("Request failed " + res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

/* Media endpoints need the Authorization header, so they cannot be used
   directly as <img src>. Fetch as a blob and hand back an object URL. */
async function authBlobUrl(path) {
  if (blobCache.has(path)) return blobCache.get(path);
  const res = await fetch(API + path, { headers: { "Authorization": "Bearer " + token } });
  if (!res.ok) throw new Error("Media failed " + res.status);
  const url = URL.createObjectURL(await res.blob());
  blobCache.set(path, url);
  return url;
}

function fmtDate(v) {
  if (!v) return "";
  const d = new Date(v);
  return isNaN(d) ? "" : d.toLocaleString([], { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
}
function fmtSize(b) {
  if (b >= 1e9) return (b/1e9).toFixed(1) + " GB";
  if (b >= 1e6) return (b/1e6).toFixed(0) + " MB";
  return Math.max(1, Math.round(b/1e3)) + " KB";
}

function loadPrefs() {
  try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { return {}; }
}
function savePrefs(p) { localStorage.setItem(PREF_KEY, JSON.stringify(p)); }

/* ---------------------------- shell ---------------------------- */

function setTitle(t, back) {
  $("#title").textContent = t;
  $("#backBtn").classList.toggle("hidden", !back);
  $("#backBtn").onclick = back || null;
}

function show(view_) {
  view = view_;
  currentJob = null;
  stopPolling();
  document.querySelectorAll("nav.bottom button").forEach(b =>
    b.classList.toggle("active", b.dataset.view === view_));
  ({ upload: renderUpload, jobs: renderJobs, connections: renderConnections, settings: renderSettings })[view_]();
}

document.querySelectorAll("nav.bottom button").forEach(b =>
  b.addEventListener("click", () => show(b.dataset.view)));

function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

/* ---------------------------- sign in ---------------------------- */

function renderSignIn(message) {
  $("#nav").classList.add("hidden");
  setTitle("Beathill Studio", null);
  $("#accountLabel").textContent = "";
  $("#main").innerHTML = `
    <div class="card">
      <h2>Sign in</h2>
      <p class="muted">Paste the access token you were given. It is stored only on this device.</p>
      ${message ? `<p class="muted" style="color:var(--error)">${esc(message)}</p>` : ""}
      <label class="field"><span>Access token</span>
        <input type="text" id="tok" placeholder="bst_..." autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
      <button class="filled" id="go">Continue</button>
    </div>`;
  $("#go").onclick = async () => {
    const value = $("#tok").value.trim();
    if (!value) return toast("Enter your token");
    $("#go").disabled = true;
    try {
      token = value;
      account = await api("GET", "/api/mobile/account");
      localStorage.setItem(TOKEN_KEY, value);
      start();
    } catch (e) {
      token = null;
      $("#go").disabled = false;
      renderSignIn(e.status === 401 ? "That token was not accepted." : e.message);
    }
  };
}

/* ---------------------------- upload ---------------------------- */

function renderUpload() {
  setTitle("New video", null);
  const p = loadPrefs();
  const val = (k, d) => (p[k] !== undefined ? p[k] : d);
  $("#main").innerHTML = `
    <div id="resumeSlot"></div>

    <div class="card">
      <h2>Video</h2>
      <input type="file" id="files" accept="video/*,${ALLOWED.join(",")}" multiple>
      <p class="muted" id="fileInfo">Up to 20 files. mp4, mov, avi, mkv, webm.</p>
    </div>

    <div class="card">
      <h2>What is this video about?</h2>
      <p class="muted">Used for titles, descriptions and hashtags. Speech recognition errors are ignored when you fill this in.</p>
      <textarea id="context" placeholder="e.g. Rim repair at the race, aluminium shavings explained">${esc(val("context",""))}</textarea>
    </div>

    <div class="card">
      <h2>Editing</h2>
      <div class="toggle"><span>Minimal cuts</span>
        <input type="checkbox" id="minimal_cuts" ${val("minimal_cuts",false)?"checked":""}></div>
      <div class="toggle"><span>Burn captions into video</span>
        <input type="checkbox" id="burn_captions" ${val("burn_captions",true)?"checked":""}></div>
      <div class="toggle"><span>Already captioned</span>
        <input type="checkbox" id="precaptioned" ${val("precaptioned",false)?"checked":""}></div>
      <label class="field"><span>Trim from end (seconds)</span>
        <input type="number" id="remove_outro_seconds" min="0" max="60" value="${esc(val("remove_outro_seconds","3"))}"></label>
      <label class="field"><span>Orientation</span>
        <select id="orientation">
          <option value="auto" ${val("orientation","auto")==="auto"?"selected":""}>Auto</option>
          <option value="horizontal" ${val("orientation","auto")==="horizontal"?"selected":""}>Horizontal</option>
        </select></label>
    </div>

    <div class="card">
      <h2>Captions</h2>
      <label class="field"><span>Position</span>
        <select id="caption_position">
          <option value="bottom" ${val("caption_position","bottom")==="bottom"?"selected":""}>Bottom</option>
          <option value="center" ${val("caption_position","bottom")==="center"?"selected":""}>Center</option>
          <option value="top" ${val("caption_position","bottom")==="top"?"selected":""}>Top</option>
        </select></label>
      <div class="row" style="margin-bottom:12px">
        <span class="spacer">Highlight colour</span>
        <input type="color" id="caption_highlight_color" value="${esc(val("caption_highlight_color","#78D99A"))}">
      </div>
      <div class="toggle"><span>Caption border</span>
        <input type="checkbox" id="caption_border" ${val("caption_border",true)?"checked":""}></div>
      <div class="row">
        <span class="spacer">Border colour</span>
        <input type="color" id="caption_border_color" value="${esc(val("caption_border_color","#000000"))}">
      </div>
    </div>

    <div class="card">
      <h2>After processing</h2>
      <div class="toggle"><span>Post to YouTube automatically</span>
        <input type="checkbox" id="youtube_autopost" ${val("youtube_autopost",false)?"checked":""}></div>
    </div>

    <div class="card" id="progressCard" style="display:none">
      <h2 id="progressLabel">Uploading</h2>
      <div class="bar"><i id="progressBar"></i></div>
      <p class="muted" id="progressText"></p>
    </div>

    <button class="filled" id="startBtn">Upload and process</button>
    <p class="muted center" style="margin-top:10px">Keep this page open until the upload finishes.</p>`;

  $("#files").onchange = () => {
    const fs = Array.from($("#files").files || []);
    $("#fileInfo").textContent = fs.length
      ? fs.map(f => `${f.name} (${fmtSize(f.size)})`).join(", ")
      : "Up to 20 files. mp4, mov, avi, mkv, webm.";
  };
  $("#startBtn").onclick = startUpload;
  renderResumeCard();
}

/* Offer to finish an interrupted upload. The browser cannot re-open a file on
   its own, so the user re-picks it; we then skip whatever the server already has. */
function renderResumeCard() {
  const slot = $("#resumeSlot");
  const pending = getPending();
  if (!slot || !pending) return;
  const names = (pending.files || []).map(f => f.name).join(", ");
  slot.innerHTML = `
    <div class="card" style="border-color:var(--primary)">
      <h2>Unfinished upload</h2>
      <p class="muted">${esc(names)} — ${pending.percent || 0}% uploaded.
         Pick the same file${(pending.files||[]).length > 1 ? "s" : ""} again to carry on where it stopped.</p>
      <input type="file" id="resumeFiles" accept="video/*,${ALLOWED.join(",")}" multiple style="margin-bottom:12px">
      <div class="row">
        <button class="tonal" id="resumeBtn">Resume</button>
        <span class="spacer"></span>
        <button class="text danger" id="discardBtn">Discard</button>
      </div>
      <div id="resumeMsg" class="muted" style="margin-top:8px"></div>
    </div>`;
  $("#discardBtn").onclick = () => {
    if (!confirm("Discard the unfinished upload?")) return;
    clearPending(); renderUpload(); toast("Discarded");
  };
  $("#resumeBtn").onclick = async () => {
    const picked = Array.from($("#resumeFiles").files || []);
    if (!picked.length) return toast("Choose the same video again");
    const ordered = matchFiles(picked, pending.files || []);
    if (!ordered) {
      $("#resumeMsg").innerHTML = `<span style="color:var(--error)">That is not the same file.
        Pick <b>${esc(names)}</b>, or press Discard to start over.</span>`;
      return;
    }
    await runUpload(ordered, { upload_id: pending.upload_id, chunk_size: pending.chunk_size });
  };
}

/* Same files, possibly re-picked in a different order. Matched on name + exact size. */
function matchFiles(selected, wanted) {
  if (selected.length !== wanted.length) return null;
  const pool = selected.slice();
  const out = [];
  for (const w of wanted) {
    const i = pool.findIndex(f => f.name === w.name && f.size === w.size);
    if (i < 0) return null;
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}

function collectOptions() {
  const o = {
    context: $("#context").value.trim(),
    minimal_cuts: $("#minimal_cuts").checked,
    burn_captions: $("#burn_captions").checked,
    precaptioned: $("#precaptioned").checked,
    youtube_autopost: $("#youtube_autopost").checked,
    remove_outro_seconds: String($("#remove_outro_seconds").value || "3"),
    orientation: $("#orientation").value,
    caption_position: $("#caption_position").value,
    caption_highlight_color: $("#caption_highlight_color").value,
    caption_border: $("#caption_border").checked,
    caption_border_color: $("#caption_border_color").value,
  };
  savePrefs(o);
  return o;
}

async function startUpload() {
  if (uploading) return toast("An upload is already running");
  const files = Array.from($("#files").files || []);
  if (!files.length) return toast("Choose a video first");
  if (files.length > 20) return toast("Maximum 20 files");
  for (const f of files) {
    const ext = "." + (f.name.split(".").pop() || "").toLowerCase();
    if (!ALLOWED.includes(ext)) return toast(`Unsupported file type: ${f.name}`);
    if (!f.size) return toast(`${f.name} looks empty`);
  }
  if (getPending() && !confirm("You have an unfinished upload. Start a new one and discard it?")) return;

  setProgress(0, "Preparing…");
  let session;
  try {
    session = await api("POST", "/api/mobile/uploads", {
      files: files.map(f => ({ name: f.name, size: f.size })),
      ...collectOptions(),
    });
  } catch (e) {
    setProgress(0, "");
    $("#progressCard").style.display = "none";
    return toast(e.message || "Could not start the upload");
  }
  setPending({
    upload_id: session.upload_id,
    chunk_size: session.chunk_size || CHUNK_FALLBACK,
    files: files.map(f => ({ name: f.name, size: f.size })),
    percent: 0,
    created_at: Date.now(),
  });
  await runUpload(files, session);
}

function setProgress(pct, text) {
  const card = document.getElementById("progressCard");
  if (card) card.style.display = "";
  const bar = document.getElementById("progressBar");
  const txt = document.getElementById("progressText");
  if (bar) bar.style.width = pct + "%";
  if (txt) txt.textContent = text;
}

/* Shared by first attempt and resume. Always asks the server for the real
   offsets first, so it can never double-send or skip bytes. */
async function runUpload(files, session) {
  const uploadId = session.upload_id;
  const chunkSize = session.chunk_size || CHUNK_FALLBACK;
  const total = files.reduce((s, f) => s + f.size, 0);
  const btn = document.getElementById("startBtn");
  const rbtn = document.getElementById("resumeBtn");
  if (btn) btn.disabled = true;
  if (rbtn) rbtn.disabled = true;
  uploading = true;
  await acquireWakeLock();

  const report = (doneBytes, label) => {
    const pct = Math.min(100, Math.round(doneBytes * 100 / total));
    setProgress(pct, label);
    const p = getPending();
    if (p) { p.percent = pct; setPending(p); }
    return pct;
  };

  try {
    setProgress(0, "Checking what already uploaded…");
    let remote;
    try {
      remote = await api("GET", `/api/mobile/uploads/${uploadId}`);
    } catch (e) {
      if (e.status === 404 || e.status === 410) {
        clearPending();
        throw new Error("That upload expired on the server. Please start it again.");
      }
      throw e;
    }

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      let offset = Number((remote.files[i] || {}).uploaded || 0);
      if (offset > file.size) offset = 0;                 // server/file mismatch: redo this file
      while (offset < file.size) {
        await waitForOnline(() => setProgress(
          Math.round((files.slice(0, i).reduce((s, f) => s + f.size, 0) + offset) * 100 / total),
          "Waiting for network…"));
        const end = Math.min(offset + chunkSize, file.size);
        await putChunk(uploadId, i, offset, file.slice(offset, end));
        offset = end;
        const doneBytes = files.slice(0, i).reduce((s, f) => s + f.size, 0) + offset;
        const pct = report(doneBytes, `${file.name} — ${Math.min(100, Math.round(doneBytes * 100 / total))}%`);
        if (pct >= 100) setProgress(100, "Finishing…");
      }
    }

    setProgress(100, "Finishing…");
    const done = await api("POST", `/api/mobile/uploads/${uploadId}/complete`, {});
    clearPending();
    toast("Upload complete — processing started");
    show("jobs");
    setTimeout(() => openJob(done.job_id), 300);
  } catch (e) {
    // Keep the pending record so the user can resume instead of restarting.
    toast(e.message || "Upload interrupted — you can resume it");
    if (view === "upload") renderUpload();
  } finally {
    uploading = false;
    releaseWakeLock();
    if (btn) btn.disabled = false;
    if (rbtn) rbtn.disabled = false;
  }
}

async function putChunk(uploadId, index, offset, blob, attempt = 0) {
  const backoff = () => new Promise(r => setTimeout(r, Math.min(15000, 1000 * Math.pow(2, attempt))));
  let res;
  try {
    res = await fetch(`${API}/api/mobile/uploads/${uploadId}/files/${index}`, {
      method: "PUT",
      headers: {
        "Authorization": "Bearer " + token,
        "Upload-Offset": String(offset),
        "Content-Type": "application/octet-stream",
      },
      body: blob,
    });
  } catch (netErr) {
    // Connection dropped, flight mode, tab throttled by the OS.
    if (attempt < 8) { await waitForOnline(); await backoff(); return putChunk(uploadId, index, offset, blob, attempt + 1); }
    throw new Error("Lost connection while uploading");
  }
  if (res.ok) return;
  // Mirrors the Android worker: 409 and 5xx are retryable, other 4xx are terminal.
  if ((res.status === 409 || res.status >= 500) && attempt < 8) {
    await waitForOnline(); await backoff();
    return putChunk(uploadId, index, offset, blob, attempt + 1);
  }
  if (res.status === 401) throw new Error("Your access token is no longer valid. Sign in again.");
  let detail = "";
  try { const j = JSON.parse(await res.text()); detail = typeof j.detail === "string" ? j.detail : (j.detail?.message || ""); } catch {}
  throw new Error(detail || `Upload failed (${res.status})`);
}

/* ---------------------------- jobs ---------------------------- */

async function renderJobs() {
  setTitle("Videos", null);
  $("#main").innerHTML = `<div class="card"><p class="muted">Loading…</p></div>`;
  try {
    const data = await api("GET", "/api/mobile/jobs?limit=50");
    const jobs = data.jobs || [];
    if (!jobs.length) {
      $("#main").innerHTML = `<div class="card center"><p class="muted">No videos yet.</p>
        <button class="tonal" onclick="show('upload')">Upload one</button></div>`;
      return;
    }
    const card = el(`<div class="card"></div>`);
    jobs.forEach(j => {
      const pct = (j.progress && j.progress.percent) || 0;
      const step = j.current_step || (j.progress && j.progress.step) || "";
      const row = el(`
        <div class="job">
          <div class="meta">
            <div class="name">${esc(j.original_filename || "Video")}</div>
            <div class="muted">${esc(fmtDate(j.created_at))}${step ? " · " + esc(step) : ""}</div>
            ${["processing","pending","queued","running"].includes(j.status)
              ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}
            ${j.error_message ? `<div class="muted" style="color:var(--error)">${esc(j.error_message)}</div>` : ""}
          </div>
          <span class="status ${esc(j.status)}">${esc(j.status)}</span>
        </div>`);
      row.onclick = () => openJob(j.id);
      card.appendChild(row);
    });
    $("#main").innerHTML = "";
    $("#main").appendChild(card);

    // Live refresh while anything is still processing.
    if (jobs.some(j => ["processing","pending","queued","running"].includes(j.status))) {
      stopPolling();
      pollTimer = setInterval(() => { if (view === "jobs" && !currentJob) renderJobs(); }, 5000);
    }
  } catch (e) {
    $("#main").innerHTML = `<div class="card"><p class="muted">${esc(e.message)}</p></div>`;
  }
}

/* ---------------------------- job detail ---------------------------- */

async function openJob(jobId) {
  stopPolling();
  currentJob = jobId;
  setTitle("Video", () => show("jobs"));
  $("#main").innerHTML = `<div class="card"><p class="muted">Loading…</p></div>`;
  await refreshJob(jobId, true);
  pollTimer = setInterval(() => { if (currentJob === jobId) refreshJob(jobId, false); }, 4000);
}

async function refreshJob(jobId, full) {
  let d;
  try { d = await api("GET", `/api/mobile/jobs/${jobId}`); }
  catch (e) { $("#main").innerHTML = `<div class="card"><p class="muted">${esc(e.message)}</p></div>`; return; }
  if (currentJob !== jobId) return;

  const busy = ["processing","pending","queued","running"].includes(d.status);
  const pub = d.publish_status || { status: "idle" };

  // While processing, keep it light: status + progress only.
  if (busy) {
    const pct = (d.progress && d.progress.percent) || 0;
    $("#main").innerHTML = `
      <div class="card">
        <h2>${esc(d.original_filename || "Video")}</h2>
        <p class="muted">${esc(d.current_step || (d.progress && d.progress.step) || "Processing")}</p>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <p class="muted">${pct}%</p>
      </div>`;
    return;
  }

  if (d.status === "failed") {
    $("#main").innerHTML = `
      <div class="card">
        <h2>${esc(d.original_filename || "Video")}</h2>
        <p class="muted" style="color:var(--error)">${esc(d.error_message || "Processing failed")}</p>
        <div class="row" style="margin-top:12px">
          <button class="tonal" id="retry">Retry</button>
          <button class="text danger" id="del">Delete</button>
        </div>
      </div>`;
    $("#retry").onclick = async () => {
      try { await api("POST", `/api/mobile/jobs/${jobId}/retry`); toast("Retrying"); openJob(jobId); }
      catch (e) { toast(e.message); }
    };
    $("#del").onclick = () => deleteJob(jobId);
    return;
  }

  if (!full && document.getElementById("publishBtn")) {
    updatePublishStatus(pub);   // avoid clobbering edits mid-typing
    return;
  }

  renderJobDetail(d);
}

function renderJobDetail(d) {
  const jobId = d.id;
  const cands = d.thumbnail_candidates || [];
  const sel = d.selected_thumbnail_index || 1;
  const media = d.media || {};

  $("#main").innerHTML = `
    <div class="card">
      <h2>${esc(d.original_filename || "Video")}</h2>
      <div id="videoBox"></div>
    </div>

    <div class="card">
      <h2>Thumbnail</h2>
      <div class="strip" id="strip"></div>
      <label class="field" style="margin-top:12px"><span>Thumbnail text (FI)</span>
        <input type="text" id="tt_fi" value="${esc(d.thumbnail_text_fi || "")}"></label>
      <label class="field"><span>Thumbnail text (EN)</span>
        <input type="text" id="tt_en" value="${esc(d.thumbnail_text_en || "")}"></label>
      <div class="row" style="margin-bottom:12px">
        <span class="spacer">Text colour</span>
        <input type="color" id="tt_color" value="#FFFFFF">
      </div>
      <button class="tonal" id="applyThumb">Apply thumbnail</button>
    </div>

    <div class="card">
      <h2>Title &amp; description</h2>
      <label class="field"><span>Title</span>
        <input type="text" id="title_fi" value="${esc(d.title_fi || "")}"></label>
      <label class="field"><span>Description</span>
        <textarea id="desc_fi">${esc(d.description_fi || "")}</textarea></label>
      ${(d.hashtags || []).length ? `<p class="muted">${esc((d.hashtags||[]).join(" "))}</p>` : ""}
      <button class="tonal" id="saveMeta">Save</button>
    </div>

    <div class="card">
      <h2>Publish</h2>
      <p class="muted">Posts to the accounts you linked under <b>Accounts</b>.</p>
      <div class="chips" id="platformChips" style="margin:12px 0"></div>
      <label class="field"><span>Language</span>
        <select id="pubLang"><option value="fi">Finnish</option><option value="en">English</option></select></label>
      <label class="field"><span>Thumbnail text</span>
        <select id="pubThumb"><option value="fi">Finnish</option><option value="en">English</option></select></label>
      <label class="field"><span>Format</span>
        <select id="pubType"><option value="short">Short / Reel</option><option value="video">Full video</option></select></label>
      <button class="filled" id="publishBtn">Publish</button>
      <div id="pubStatus" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <button class="text danger" id="del">Delete video</button>
    </div>`;

  // video preview (authenticated)
  if (d.has_video && media.video) {
    authBlobUrl(media.video)
      .then(url => { $("#videoBox").innerHTML = ""; $("#videoBox").appendChild(el(`<video controls playsinline src="${url}"></video>`)); })
      .catch(() => { $("#videoBox").innerHTML = `<p class="muted">Preview unavailable</p>`; });
  }

  // thumbnail candidates
  const strip = $("#strip");
  let chosen = sel;
  cands.forEach(c => {
    const img = el(`<img alt="Option ${c.index}" class="${c.index === sel ? "selected" : ""}">`);
    authBlobUrl(c.url).then(u => img.src = u).catch(() => {});
    img.onclick = () => {
      chosen = c.index;
      Array.from(strip.children).forEach(n => n.classList.remove("selected"));
      img.classList.add("selected");
    };
    strip.appendChild(img);
  });

  $("#applyThumb").onclick = async () => {
    try {
      await api("POST", `/api/mobile/jobs/${jobId}/thumbnail`, {
        index: chosen,
        text_fi: $("#tt_fi").value || null,
        text_en: $("#tt_en").value || null,
        thumbnail_text_color: $("#tt_color").value || null,
      });
      blobCache.clear();
      toast("Thumbnail updated");
      refreshJob(jobId, true);
    } catch (e) { toast(e.message); }
  };

  $("#saveMeta").onclick = async () => {
    try {
      await api("PATCH", `/api/mobile/jobs/${jobId}`, {
        language: "fi",
        title: $("#title_fi").value,
        description: $("#desc_fi").value,
      });
      toast("Saved");
    } catch (e) { toast(e.message); }
  };

  $("#del").onclick = () => deleteJob(jobId);

  // platform chips reflect real connection state
  const posted = d.posted || {};
  const chipBox = $("#platformChips");
  const selected = new Set();
  api("GET", "/api/mobile/connections").then(res => {
    const conns = res.connections || {};
    chipBox.innerHTML = "";
    PLATFORMS.forEach(p => {
      const c = conns[p] || {};
      const already = posted[p];
      const chip = el(`<button class="chip" ${(!c.connected || already) ? "disabled" : ""}>
        ${PLATFORM_LABEL[p]}${already ? " ✓" : (c.connected ? "" : " (link first)")}</button>`);
      chip.onclick = () => {
        if (selected.has(p)) { selected.delete(p); chip.classList.remove("selected"); }
        else { selected.add(p); chip.classList.add("selected"); }
      };
      chipBox.appendChild(chip);
    });
  }).catch(e => { chipBox.innerHTML = `<p class="muted">${esc(e.message)}</p>`; });

  $("#publishBtn").onclick = async () => {
    if (!selected.size) return toast("Choose at least one platform");
    $("#publishBtn").disabled = true;
    try {
      await api("PATCH", `/api/mobile/jobs/${jobId}`, {
        language: "fi",
        title: $("#title_fi").value,
        description: $("#desc_fi").value,
      });
      if (cands.length) {
        await api("POST", `/api/mobile/jobs/${jobId}/thumbnail`, {
          index: chosen,
          text_fi: $("#tt_fi").value || null,
          text_en: $("#tt_en").value || null,
          thumbnail_text_color: $("#tt_color").value || null,
        });
        blobCache.clear();
      }
      await api("POST", `/api/mobile/jobs/${jobId}/publish`, {
        platforms: Array.from(selected),
        language: $("#pubLang").value,
        thumbnail: $("#pubThumb").value,
        content_type: $("#pubType").value,
      });
      toast("Publishing started");
      refreshJob(jobId, false);
    } catch (e) { toast(e.message); }
    finally { $("#publishBtn").disabled = false; }
  };

  updatePublishStatus(d.publish_status || { status: "idle" });
}

function updatePublishStatus(pub) {
  const box = document.getElementById("pubStatus");
  if (!box) return;
  if (!pub || pub.status === "idle") { box.innerHTML = ""; return; }
  const done = pub.completed || 0, total = pub.total || 0;
  const errs = Object.entries(pub.errors || {});
  box.innerHTML = `
    <p class="muted">${esc(pub.status)}${total ? ` — ${done}/${total}` : ""}${pub.current_platform ? " · " + esc(pub.current_platform) : ""}</p>
    ${errs.length ? errs.map(([k,v]) => `<p class="muted" style="color:var(--error)">${esc(k)}: ${esc(v)}</p>`).join("") : ""}`;
}

async function deleteJob(jobId) {
  if (!confirm("Delete this video and its files?")) return;
  try { await api("DELETE", `/api/mobile/jobs/${jobId}`); toast("Deleted"); show("jobs"); }
  catch (e) { toast(e.message); }
}

/* ---------------------------- connections ---------------------------- */

async function renderConnections() {
  setTitle("Accounts", null);
  $("#main").innerHTML = `<div class="card"><p class="muted">Loading…</p></div>`;
  let res;
  try { res = await api("GET", "/api/mobile/connections"); }
  catch (e) {
    $("#main").innerHTML = `<div class="card"><h2>Publishing unavailable</h2>
      <p class="muted">${esc(e.message)}</p></div>`;
    return;
  }
  const conns = res.connections || {};
  const wrap = el(`<div></div>`);
  PLATFORMS.forEach(p => {
    const c = conns[p] || {};
    const card = el(`
      <div class="card">
        <div class="row">
          <div class="spacer">
            <h2 style="margin:0">${PLATFORM_LABEL[p]}</h2>
            <p class="muted" style="margin:4px 0 0">
              ${c.connected ? esc(c.label || "Connected") : "Not linked"}
              ${c.metadata && c.metadata.needs_reconnect ? " · needs reconnect" : ""}</p>
          </div>
          <button class="${c.connected ? "outlined" : "tonal"}" data-act="${c.connected ? "dis" : "con"}">
            ${c.connected ? "Disconnect" : "Link"}</button>
        </div>
        <div class="pages"></div>
      </div>`);
    card.querySelector("button").onclick = async (ev) => {
      const act = ev.target.dataset.act;
      try {
        if (act === "con") {
          const r = await api("POST", `/api/mobile/connections/${p}/auth`);
          location.href = r.authorization_url;      // returns here after consent
        } else {
          if (!confirm(`Disconnect ${PLATFORM_LABEL[p]}?`)) return;
          await api("DELETE", `/api/mobile/connections/${p}`);
          toast("Disconnected"); renderConnections();
        }
      } catch (e) { toast(e.message); }
    };
    // Facebook page picker
    const opts = (c.metadata && c.metadata.pages) || [];
    if (p === "facebook" && c.connected && opts.length) {
      const selectedId = c.metadata.selected_page_id;
      const sel = el(`<label class="field" style="margin-top:12px"><span>Page</span>
        <select>${opts.map(o => `<option value="${esc(o.id)}" ${o.id===selectedId?"selected":""}>${esc(o.name||o.label||o.id)}</option>`).join("")}</select></label>`);
      sel.querySelector("select").onchange = async (ev) => {
        try { await api("POST", "/api/mobile/connections/facebook/page", { page_id: ev.target.value });
              toast("Page selected"); } catch (e) { toast(e.message); }
      };
      card.querySelector(".pages").appendChild(sel);
    }
    wrap.appendChild(card);
  });
  $("#main").innerHTML = "";
  $("#main").appendChild(wrap);
}

/* ---------------------------- settings ---------------------------- */

async function renderSettings() {
  setTitle("Settings", null);
  const a = account || {};
  const u = a.usage || {};
  $("#main").innerHTML = `
    <div class="card">
      <h2>Account</h2>
      <p class="muted">${esc(a.display_name || a.account_id || "Tester")}</p>
      <p class="muted">Plan: ${esc(a.plan || "free")} · Publishing: ${a.publishing_enabled ? "enabled" : "disabled"}</p>
      ${u.jobs_limit != null ? `<p class="muted">Videos used: ${esc(u.jobs_used ?? 0)} / ${esc(u.jobs_limit)}</p>` : ""}
    </div>
    <div class="card">
      <h2>This device</h2>
      <button class="outlined" id="signout">Sign out</button>
    </div>
    <div class="card">
      <p class="muted">Beathill Studio web · same processing and publishing as the Android app.</p>
    </div>`;
  $("#signout").onclick = () => {
    localStorage.removeItem(TOKEN_KEY);
    token = null; account = null;
    blobCache.forEach(URL.revokeObjectURL); blobCache.clear();
    renderSignIn();
  };
}

/* ---------------------------- boot ---------------------------- */

function start() {
  $("#nav").classList.remove("hidden");
  $("#accountLabel").textContent = (account && account.publishing_enabled) ? "" : "read-only";
  // Returning from an OAuth consent screen lands here with ?youtube=connected etc.
  const q = new URLSearchParams(location.search);
  const connected = PLATFORMS.find(p => q.get(p) === "connected") || (q.get("meta") === "connected" ? "facebook" : null);
  if (connected) {
    history.replaceState({}, "", location.pathname);
    toast(`${PLATFORM_LABEL[connected] || "Account"} linked`);
    show("connections");
    return;
  }
  show("upload");
}

(async function boot() {
  // Sign-in link format: /public/studio#token=bst_xxx
  const hash = new URLSearchParams(location.hash.slice(1));
  const fromLink = hash.get("token");
  if (fromLink) {
    localStorage.setItem(TOKEN_KEY, fromLink);
    history.replaceState({}, "", location.pathname + location.search);
  }
  token = localStorage.getItem(TOKEN_KEY);
  if (!token) return renderSignIn();
  try {
    account = await api("GET", "/api/mobile/account");
    start();
  } catch (e) {
    token = null;
    renderSignIn(e.status === 401 ? "Your access token is no longer valid." : e.message);
  }
})();
</script>
</body>
