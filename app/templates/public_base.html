<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShortGen{% endblock %}</title>
    <style>
        :root {
            --bg: #111311;
            --surface: #1b1e1b;
            --border: #343934;
            --text: #f5f7f5;
            --muted: #a1aaa1;
            --accent: #4caf50;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.65;
        }
        .shell { width: min(760px, calc(100% - 2rem)); margin: 0 auto; }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 0.75rem; color: var(--text); text-decoration: none; font-weight: 700; }
        .brand img { width: 42px; height: 42px; border-radius: 6px; }
        nav { display: flex; gap: 1rem; flex-wrap: wrap; }
        nav a, main a { color: #74d478; }
        nav a { text-decoration: none; }
        main { padding: 2.5rem 0 4rem; }
        h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 1rem; letter-spacing: 0; }
        h2 { font-size: 1.2rem; margin: 2rem 0 0.5rem; letter-spacing: 0; }
        p, li { color: var(--muted); }
        .intro { font-size: 1.05rem; max-width: 680px; }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1.25rem;
            margin-top: 1.5rem;
        }
        ul { padding-left: 1.25rem; }
        footer { border-top: 1px solid var(--border); padding: 1.5rem 0 2.5rem; color: var(--muted); }
        @media (max-width: 560px) {
            header { align-items: flex-start; flex-direction: column; }
            main { padding-top: 2rem; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header>
            <a class="brand" href="/public/app">
                <img src="/public/shortgen-logo-1024.png" alt="ShortGen logo">
                <span>ShortGen</span>
            </a>
            <nav>
                <a href="/public/app">About</a>
                <a href="/public/privacy">Privacy</a>
                <a href="/public/terms">Terms</a>
            </nav>
        </header>
        <main>{% block content %}{% endblock %}</main>
        <footer>
            ShortGen is operated by Beathill Racing. Contact:
            <a href="mailto:info@beathillracing.fi">info@beathillracing.fi</a>
        </footer>
    </div>
</body>
</html>
